<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Concept 1 · favicon: วาดใหม่บนตาราง 16×16 ไม่ได้ย่อจากตัว 64
    ก้านอยู่ที่ x=5 เส้นหนา 2 จึงทับพิกเซล 4–6 พอดี คมที่ 16px
    ตัดจุด marker ทิ้ง เพราะที่ขนาดนี้จุดจะกลายเป็นก้อน และวางบนแผ่นสี่เหลี่ยมให้เห็นบนแถบ tab ทุกสี
    media query ในไฟล์เปลี่ยนสีตามโหมดมืดของ browser ได้เอง (Chrome, Firefox)
  -->
  <style>
    .tile { fill: #ffffff; } .axis { stroke: #141b2b; } .acc { stroke: #2343c4; } .loss { stroke: #d9464e; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1b1f26; } .axis { stroke: #e8ecf3; } .acc { stroke: #8ca6ff; } .loss { stroke: #e36c72; }
    }
  </style>
  <rect class="tile" width="16" height="16" rx="3.5"/>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path class="acc" d="M5 8.5C6.5 6 8 4 12 3.5"/>
    <path class="loss" d="M5 8.5C6.5 11 8 12.5 12 12.5"/>
    <path class="axis" d="M5 3V13"/>
  </g>
</svg>
