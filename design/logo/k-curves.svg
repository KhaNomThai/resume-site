<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Kulachart logo: a K made of two learning curves</title>
  <!--
    Concept 1 · Learning curves (full colour, for light backgrounds)
    ตาราง 64×64 เส้นหนา 6 หน่วย (ราว 9% ของกรอบ) จึงยังเป็นตัว K ที่ขนาด 24px
    ก้าน x=16 คือแกน y ของกราฟ เส้นโค้งทั้งสองเริ่มจาก epoch เดียวกันที่ (16,35)
    accuracy (สีปากกาน้ำเงิน) ไต่ขึ้นแล้วค่อยๆ ราบ ส่วน loss (สีเส้น margin แดง) ดิ่งลงแล้วค่อยๆ ราบ
    จุดคือ marker ของกราฟที่ epoch ครึ่งทาง (t = 0.5 บนเส้นโค้ง) และ epoch สุดท้าย
  -->
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 35C24 24 31 13 48 10" stroke="#2343c4"/>
    <path d="M16 35C24 46 31 55 48 56" stroke="#d9464e"/>
    <!-- วาดก้านทีหลัง ให้แกนทับจุดที่เส้นโค้งเริ่ม รอยต่อจึงสะอาด -->
    <path d="M16 8V56" stroke="#141b2b"/>
  </g>
  <circle cx="28.6" cy="19.5" r="4" fill="#2343c4"/>
  <circle cx="48" cy="10" r="5" fill="#2343c4"/>
  <circle cx="28.6" cy="49.3" r="4" fill="#d9464e"/>
  <circle cx="48" cy="56" r="5" fill="#d9464e"/>
</svg>
