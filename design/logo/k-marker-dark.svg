<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Kulachart logo: a K highlighted with a marker</title>
  <!--
    Concept 3 · Highlighted K (สำหรับพื้นมืด)
    K สีอ่อนอ่านได้บนพื้นมืด แต่จะจางบนแถบเหลือง จึงวาด K สองชั้น:
    ชั้นแรกสีอ่อนทั้งตัว ชั้นที่สองสีหมึกเข้ม (on-marker) ที่ถูก clip ให้เห็นเฉพาะส่วนที่อยู่บนแถบเหลือง
  -->
  <defs>
    <clipPath id="swipe"><path d="M9 25L58 20L55 44L6 49Z"/></clipPath>
  </defs>
  <path d="M9 25L58 20L55 44L6 49Z" fill="#e9cf52"/>
  <g fill="none" stroke="#e8ecf3" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 10V54"/>
    <path d="M19 38L45 10"/>
    <path d="M28 28.3L47 54"/>
  </g>
  <g fill="none" stroke="#141b2b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#swipe)">
    <path d="M19 10V54"/>
    <path d="M19 38L45 10"/>
    <path d="M28 28.3L47 54"/>
  </g>
</svg>
