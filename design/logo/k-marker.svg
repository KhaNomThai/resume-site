<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Kulachart logo: a K highlighted with a marker</title>
  <!--
    Concept 3 · Highlighted K (full colour, for light backgrounds)
    K เขียนด้วยหมึกน้ำเงินดำ แล้วถูกขีดด้วยปากกาเน้นข้อความ ซึ่งเป็นเครื่องมือหลักของทั้งระบบ
    แถบเหลืองเป็นสี่เหลี่ยมด้านขนานเอียงขึ้นทางขวา ปลายทั้งสองข้างเฉียงขนานกันเหมือนรอยหัวปากกาแบบตัด (chisel tip)
    ขาล่างของ K แตกออกจากแขนบน (ไม่ได้ออกจากก้าน) ตามโครงตัว K แบบตัวพิมพ์ จุดเริ่ม (28, 28.3) อยู่บนเส้นแขนพอดี
    ใช้ตั้งแต่ 64px ขึ้นไป ต่ำกว่านั้นให้ใช้ k-marker-favicon.svg
  -->
  <path d="M9 25L58 20L55 44L6 49Z" fill="#ffe566"/>
  <g fill="none" stroke="#141b2b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 10V54"/>
    <path d="M19 38L45 10"/>
    <path d="M28 28.3L47 54"/>
  </g>
</svg>
