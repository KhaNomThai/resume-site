<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Kulachart logo: K plotted as data points</title>
  <!--
    Concept 5 · Scatter (สีเต็ม สำหรับพื้นสว่าง)
    K คือ scatter plot: จุดข้อมูล 11 จุดเรียงเป็นก้านและแขน จุดมุมขวาบนคือ insight ที่ถูกขีดด้วยปากกาเน้น
    ทุกจุดรัศมี 4.5 วางห่างกันราว 10–11 หน่วย ช่องว่างระหว่างจุดยังมากพอให้อ่านเป็นจุดแยกกันที่ 32px
  -->
  <circle cx="47" cy="10" r="9" fill="#ffe566" fill-opacity="1"/>
  <g fill="#141b2b">
    <circle cx="16" cy="10" r="4.5"/><circle cx="16" cy="21" r="4.5"/><circle cx="16" cy="32" r="4.5"/><circle cx="16" cy="43" r="4.5"/><circle cx="16" cy="54" r="4.5"/>
    <circle cx="26.5" cy="23.5" r="4.5"/><circle cx="36.5" cy="16" r="4.5"/>
    <circle cx="26.5" cy="42" r="4.5"/><circle cx="36.5" cy="48.5" r="4.5"/><circle cx="47" cy="55" r="4.5"/>
  </g>
  <circle cx="47" cy="10" r="4.5" fill="#2343c4"/>
</svg>
