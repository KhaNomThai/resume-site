<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Concept 7 · Signature · favicon: วาดใหม่บนตาราง 16×16 ไม่ได้ย่อจากตัว 64
    ลดห่วงที่ข้อต่อให้เหลือแค่โค้ง เพราะห่วงเล็กกว่า 1 พิกเซลจะหายไป
    media query ในไฟล์เปลี่ยนสีตามโหมดมืดของ browser ได้เอง (Chrome, Firefox)
  -->
  <style>
    .tile { fill: #ffffff; } .ink { stroke: #141b2b; } .inkf { fill: #141b2b; } .pen { stroke: #2343c4; } .penf { fill: #2343c4; } .red { stroke: #d9464e; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1b1f26; } .ink { stroke: #e8ecf3; } .inkf { fill: #e8ecf3; } .pen { stroke: #8ca6ff; } .penf { fill: #8ca6ff; } .red { stroke: #e36c72; }
    }
  </style>
  <rect class="tile" width="16" height="16" rx="3.5"/>
  <g class="pen" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.3 2.5C5.1 6 5 9 4.8 12"/>
    <path d="M12 2.8C9.5 5 7.6 7 6.6 8C5.8 8.9 7.6 9.3 8.4 10.2C9.4 11.2 10.8 12 12.3 12.4"/>
  </g>
  <path class="red" d="M3 14H13" fill="none" stroke-width="1.2" stroke-linecap="round"/>
</svg>
