<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Kulachart logo: a handwritten K signed in ballpoint</title>
  <!--
    Concept 7 · Signature (สีเต็ม สำหรับพื้นสว่าง)
    K เขียนมือด้วยปากกาลูกลื่นสีน้ำเงิน มีห่วงเล็กที่ข้อต่อแบบลายมือจริง และขีดเส้นใต้ด้วยปากกาแดงเหมือนลงชื่อท้ายหน้าสมุด
    เป็นแบบที่ "เป็นตัวคุณ" ที่สุด ความหมายด้าน data อยู่ที่บริบทของระบบ ไม่ได้อยู่ในตัวรูป
  -->
