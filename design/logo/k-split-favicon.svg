<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Concept 2 · favicon: วาดใหม่บนตาราง 16×16 ตัดใบปลายกิ่งทิ้ง เหลือ node สีปากกาซึ่งเป็นแก่นของ concept
    media query ในไฟล์เปลี่ยนสีตามโหมดมืดของ browser ได้เอง (Chrome, Firefox)
  -->
  <style>
    .tile { fill: #ffffff; } .ink { stroke: #141b2b; } .node { fill: #2343c4; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1b1f26; } .ink { stroke: #e8ecf3; } .node { fill: #8ca6ff; }
    }
  </style>
  <rect class="tile" width="16" height="16" rx="3.5"/>
  <g class="ink" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M5 3V13"/>
    <path d="M5 8.5L11.5 3.5"/>
    <path d="M5 8.5L11.5 13"/>
  </g>
  <circle class="node" cx="5" cy="8.5" r="2.6"/>
</svg>
