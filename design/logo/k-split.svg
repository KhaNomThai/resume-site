<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Kulachart logo: a K drawn as a decision split</title>
  <!--
    Concept 2 · Decision split (full colour, for light backgrounds)
    K คือ decision tree ขนาดเล็ก: ข้อมูลไหลลงก้าน มาถึง node ตัดสินใจ (สีปากกาน้ำเงิน) แล้วแยกเป็นสองกิ่ง
    ใบปลายกิ่งเป็น plot marker ของระบบเอง: ● (หมวด ML / DL) และ ■ (หมวด Data)
    node อยู่ที่ y=33 กิ่งบนขึ้น 21 หน่วย กิ่งล่างลง 20 หน่วย ตัว K จึงสมดุล และใบล่างไม่ยื่นต่ำกว่าก้าน
  -->
  <g fill="none" stroke="#141b2b" stroke-width="6" stroke-linecap="round">
    <path d="M16 8V56"/>
    <path d="M16 33L44 13"/>
    <path d="M16 33L44 53"/>
  </g>
  <circle cx="16" cy="33" r="6.5" fill="#2343c4"/>
  <circle cx="46" cy="12" r="6" fill="#141b2b"/>
  <rect x="40.5" y="48" width="11" height="11" fill="#141b2b"/>
</svg>
